# disk-guard 盯盘清单：档位|路径|它是什么|建议清理方式（只供人看，脚本从不执行）
# 档位：1=可重建  2=有真实数据，逐项批准  3=只有你能决定  X=禁止清理，只监控
# 路径以 ~ 开头会展开为 $HOME。以 @ 开头的是特殊统计项。
1|~/Library/Caches|各应用缓存|按子目录看，删前退出对应应用
1|~/.cache|pip/uv/Hugging Face 等缓存|uv cache clean / pip cache purge；huggingface 看项目是否在用
1|~/.npm|npm 包缓存|npm cache clean --force
1|~/Library/Caches/ms-playwright|Playwright 浏览器（已含在 Library/Caches 内，勿重复相加）|仍在用的项目会重新下载
1|@node_modules|~/Cursor 下全部 node_modules|删后对应项目需 npm install
1|@venv|~/Cursor 下全部 .venv|删后对应项目需重建虚拟环境
1|~/Library/Developer/Xcode/DerivedData|Xcode 构建产物|Xcode 里清理或删目录
2|~/.ollama/models|本地大模型|ollama rm <模型名>
2|@docker|Docker 虚拟磁盘（显示/实占分开）|docker system prune（不加 --volumes 除非确认卷里无数据）
2|~/.orbstack|OrbStack 虚拟磁盘|orb 内清理后再压缩
2|/Library/Developer/CoreSimulator|iOS 模拟器 runtime|xcrun simctl runtime delete <UUID>
3|~/Downloads|下载目录|列清单逐个决定
3|~/.Trash|废纸篓|Finder 清倒
X|~/.hermes|Hermes：会话库、记忆、浏览器登录态|不清理；如需瘦身单独评估
X|~/.codex|Codex 会话与配置|不清理
X|~/.claude|Claude Code 会话与配置|不清理
@snapshots|APFS 本地快照|com.apple.os.update 开头的不要动
